let audioCtx, masterGain, musicTimer, musicOn=true;
function startMusic(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); masterGain.gain.value=.045; masterGain.connect(audioCtx.destination);
  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  let k=0;
  musicTimer=setInterval(()=>{
    if(!musicOn)return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=notes[k++%notes.length];
    g.gain.setValueAtTime(0,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(.35,audioCtx.currentTime+.03);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.42);
    o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+.45);
  },500);
}

let i=Number(localStorage.getItem("mz_level")||0), lives=3, score=Number(localStorage.getItem("mz_score")||0), locked=false;
const $=id=>document.getElementById(id);
function render(){
 locked=false;
 $("level").textContent=`Уровень ${i+1} из ${levels.length}`;
 $("question").textContent=levels[i].q;
 $("options").innerHTML="";
 levels[i].a.forEach((x,n)=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>answer(n,b);$("options").appendChild(b)});
 $("message").textContent="";
 $("hint").disabled=false;
 $("hint").textContent="💡 Подсказка — 30 очков";
 $("restart").style.display="none";
 update();
}
function update(){
 $("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 $("score").textContent=score;
}
function answer(n,b){
 if(locked)return; locked=true;
 const L=levels[i];
 if(n===L.c){
   b.classList.add("correct"); score+=100;
   $("message").textContent="✅ Правильно! +100 очков";
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   setTimeout(()=>{i++; localStorage.setItem("mz_level",i); localStorage.setItem("mz_score",score); if(i>=levels.length) win(); else render()},800);
 }else{
   b.classList.add("wrong"); lives--; update();
   $("message").textContent="❌ Ошибка! Ты потерял жизнь.";
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   if(lives<=0){setTimeout(gameOver,700);return}
   setTimeout(()=>{locked=false;document.querySelectorAll(".option").forEach(x=>{x.disabled=false;x.classList.remove("wrong")});$("message").textContent="Попробуй ещё раз.",700});
 }
}
$("hint").onclick=()=>{
 if(locked||score<30)return;
 score-=30; $("hint").disabled=true; $("hint").textContent="💡 "+levels[i].h; update();
};
function gameOver(){localStorage.removeItem("mz_level");localStorage.removeItem("mz_score");locked=true;$("question").textContent="💀 Игра окончена";$("options").innerHTML="";$("hint").style.display="none";$("message").textContent=`Ты набрал ${score} очков.`;$("restart").style.display="block"}
function win(){locked=true;$("question").textContent="🏆 Ты победил!";$("options").innerHTML="";$("hint").style.display="none";$("message").textContent=`Все ${levels.length} уровней пройдены! Очки: ${score}`;$("restart").style.display="block"}
 $("restart").onclick=()=>{i=0;lives=3;score=0;localStorage.removeItem("mz_level");localStorage.removeItem("mz_score");$("hint").style.display="block";render()};
$("startBtn").onclick=()=>{ $("startScreen").style.display="none"; startMusic(); };
$("musicBtn").onclick=()=>{
  musicOn=!musicOn;
  $("musicBtn").textContent=musicOn?"🔊":"🔇";
  if(masterGain) masterGain.gain.value=musicOn?.045:0;
};
render();
</script>
</body>
</html>
